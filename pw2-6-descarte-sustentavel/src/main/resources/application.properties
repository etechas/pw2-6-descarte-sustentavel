spring.application.name=descarte-sustentavel

# Conexao com Microsoft SQL Server (ajuste DB_URL, DB_USERNAME e DB_PASSWORD
# nas variaveis de ambiente do IntelliJ quando o SQL Server estiver instalado).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=EscolaDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA_DO_SQL_SERVER}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA: valida a estrutura criada pelo script SQL; nao cria tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
